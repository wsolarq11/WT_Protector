name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"
          cache: true
          cache-dependency-path: |
            src/avalonia-launcher/src/WTLauncher.App/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Core/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Analyzers/packages.lock.json
            src/avalonia-launcher/tests/WTLauncher.Tests/packages.lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Fast test lane
        run: npm run test:fast -- --logger "trx;LogFileName=wtlauncher-fast.trx"

      - name: NuGet security audit
        run: |
          dotnet restore src/avalonia-launcher/WTLauncher.Avalonia.sln -r win-x64 -p:EnableNativeAot=true --locked-mode
          dotnet list src/avalonia-launcher/WTLauncher.Avalonia.sln package --vulnerable --include-transitive --no-restore

      - name: Prepare launcher store
        shell: pwsh
        run: Copy-Item config/launcher.ci.json config/launcher.json -Force

      - name: Full native gate
        run: npm run verify

      - name: Release contract
        run: npm run release:contract

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: src/avalonia-launcher/artifacts/publish/win-x64/
