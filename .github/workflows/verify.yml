name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.301"
          cache: true
          cache-dependency-path: |
            src/avalonia-launcher/src/WTLauncher.App/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Core/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Analyzers/packages.lock.json
            src/avalonia-launcher/tests/WTLauncher.Tests/packages.lock.json

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        shell: pwsh
        run: |
          Copy-Item config/launcher.ci.json config/launcher.json -Force
          npm run verify