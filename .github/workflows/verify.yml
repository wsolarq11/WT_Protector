name: CI / Native Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/avalonia-launcher/WTLauncher.Avalonia.sln -r win-x64 -p:EnableNativeAot=true --locked-mode

      - name: Build
        run: dotnet build src/avalonia-launcher/WTLauncher.Avalonia.sln --no-restore -warnaserror

      - name: Test (fast lane)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\test-fast.ps1 -Logger "trx;LogFileName=wtlauncher-fast.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/avalonia-launcher/tests/WTLauncher.Tests/TestResults/

  nuget-audit:
    name: NuGet Security Audit
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Audit
        run: dotnet nuget audit src/avalonia-launcher/WTLauncher.Avalonia.sln

  release-contract:
    name: Release Contract
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Run release contract
        run: npm ci && npm run release:contract

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-contract-artifacts
          path: src/avalonia-launcher/artifacts/publish/win-x64/

  full-gate:
    name: Full Native Gate (verify.ps1)
    runs-on: windows-latest
    needs: [build-and-test, nuget-audit, release-contract]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run native gate
        shell: powershell
        run: .\tools\verify.ps1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/avalonia-launcher/artifacts/coverage/
