name: CI / Native Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/avalonia-launcher/WTLauncher.Avalonia.sln

      - name: Build
        run: dotnet build src/avalonia-launcher/WTLauncher.Avalonia.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test src/avalonia-launcher/WTLauncher.Avalonia.sln --no-build --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/avalonia-launcher/tests/WTLauncher.Tests/TestResults/

  nuget-audit:
    name: NuGet Security Audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit
        run: dotnet restore src/avalonia-launcher/WTLauncher.Avalonia.sln --audit
        continue-on-error: true

  full-gate:
    name: Full Native Gate (verify.ps1)
    runs-on: windows-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run native gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify.ps1
