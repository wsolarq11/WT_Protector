name: Dependabot lockfile refresh

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"
          cache: true
          cache-dependency-path: |
            src/avalonia-launcher/src/WTLauncher.App/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Core/packages.lock.json
            src/avalonia-launcher/src/WTLauncher.Analyzers/packages.lock.json
            src/avalonia-launcher/tests/WTLauncher.Tests/packages.lock.json

      - name: Regenerate NuGet lock files
        shell: pwsh
        run: dotnet restore src/avalonia-launcher/WTLauncher.Avalonia.sln -r win-x64 -p:EnableNativeAot=true --force-evaluate

      - name: Commit refreshed lock files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/avalonia-launcher/src/WTLauncher.App/packages.lock.json src/avalonia-launcher/src/WTLauncher.Core/packages.lock.json src/avalonia-launcher/src/WTLauncher.Analyzers/packages.lock.json src/avalonia-launcher/tests/WTLauncher.Tests/packages.lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore(deps): refresh nuget lock files"
          git push
