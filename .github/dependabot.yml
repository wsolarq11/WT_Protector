version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/avalonia-launcher/"
    schedule:
      interval: "weekly"
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      xunit:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
